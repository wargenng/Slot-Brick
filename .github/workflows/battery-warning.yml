name: Brick build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test LED and power behavior
        run: |
          sh brick/sim.sh unit
          docker run --rm -v "$PWD":/src -w /src -e CARGO_HOME=/src/.docker-cache/cargo slot-brick-sim \
            cargo test --locked --release --target-dir target-sim -p slot --no-default-features --features sim \
            --test led --test power --test brick_shutdown --test brick_led_menu
          docker run --rm -v "$PWD":/src -w /src -e CARGO_HOME=/src/.docker-cache/cargo \
            slot-brick-sim cargo test --locked --release -p slot-power --test device
      - name: Exercise warning through the running frontend
        run: sh brick/sim.sh test battery leds sleep
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: battery-warning-test-logs
          path: target-sim/out
          if-no-files-found: ignore
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build SD card package
        run: |
          sh brick/docker-build.sh
          python3 brick/zip-card.py dist-brick slot-brick-main-sd-card.zip
          sha256sum slot-brick-main-sd-card.zip > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: slot-brick-main-sd-card
          path: |
            slot-brick-main-sd-card.zip
            SHA256SUMS
